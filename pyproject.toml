[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator"
readme = "mazegen/README.md"
requires-python = ">=3.10"
authors = [{ name = "kkariya", email = "kkariya@student.42tokyo.jp" }]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
exclude = '^(\.venv|build|dist)/'
